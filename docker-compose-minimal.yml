version: '3.8'

services:
  # MQTT Broker - Core UNS (Unified Namespace) service
  emqx:
    image: emqx/emqx:5.8
    container_name: supos-mqtt
    ports:
      - "1883:1883"   # MQTT
      - "8083:8083"   # MQTT over WebSocket
      - "8883:8883"   # MQTT over TLS
      - "8084:8084"   # MQTT WebSocket over TLS
      - "18083:18083" # Dashboard
    environment:
      EMQX_NAME: emqx
      EMQX_HOST: 127.0.0.1
      EMQX_LOADED_PLUGINS: "emqx_management,emqx_auth_username,emqx_auth_clientid"
      EMQX_AUTH__USER__1__USERNAME: supos
      EMQX_AUTH__USER__1__PASSWORD: supos
      EMQX_ALLOW_ANONYMOUS: "true"
    volumes:
      - ./volumes/emqx/data:/opt/emqx/data
      - ./volumes/emqx/log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Node-RED - Data Flow and Event Processing
  nodered:
    image: nodered/node-red:latest
    container_name: supos-nodered
    ports:
      - "1880:1880"
    environment:
      NODE_RED_CREDENTIAL_SECRET: supos-secret
    volumes:
      - ./volumes/nodered/data:/data
    depends_on:
      - emqx
    restart: unless-stopped

  # Grafana - Dashboard and Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: supos-grafana
    ports:
      - "3003:3000"
    environment:
      GF_SECURITY_ADMIN_USER: supos
      GF_SECURITY_ADMIN_PASSWORD: supos
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./volumes/grafana/data:/var/lib/grafana
      - ./volumes/grafana/logs:/var/log/grafana
    depends_on:
      - emqx
    restart: unless-stopped

networks:
  default:
    name: supos_default_network
    driver: bridge